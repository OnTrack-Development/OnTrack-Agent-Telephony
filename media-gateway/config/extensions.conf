[general]
static=yes
writeprotect=no
clearglobalvars=no

[from-provider]
exten => _X!,1,NoOp(OnTrack Media Gateway incoming bridge call)
 same => n,Answer()
 same => n,Set(CHANNEL(language)=en)
 same => n,Set(TIMEOUT(digit)=4)
 same => n,Set(TIMEOUT(response)=12)
 same => n,Read(ONTRACK_PIN,,8,,1,12)
 same => n,GotoIf($[${LEN(${ONTRACK_PIN})}=8]?pin_ok:pin_bad)

 same => n(pin_bad),NoOp(Invalid or missing OnTrack media PIN)
 same => n,AGI(ontrack_event.py,failed,${ONTRACK_PIN},${UNIQUEID},invalid_or_missing_pin)
 same => n,Hangup()

 same => n(pin_ok),Set(ONTRACK_RECFILE=/var/spool/asterisk/monitor/ontrack-${ONTRACK_PIN}-${UNIQUEID}.wav)
 same => n,AGI(ontrack_event.py,connected,${ONTRACK_PIN},${UNIQUEID})
 same => n,MixMonitor(${ONTRACK_RECFILE})
 same => n,AGI(ontrack_event.py,recording,${ONTRACK_PIN},${UNIQUEID})
 same => n,Wait(86400)
 same => n,Hangup()

exten => h,1,NoOp(OnTrack Media Gateway hangup)
 same => n,StopMixMonitor()
 same => n,ExecIf($[${LEN(${ONTRACK_PIN})}=8]?AGI(ontrack_event.py,ended,${ONTRACK_PIN},${UNIQUEID}))
 same => n,ExecIf($[${LEN(${ONTRACK_PIN})}=8]?AGI(ontrack_upload.py,${ONTRACK_PIN},${ONTRACK_RECFILE}))

services:
  ontrack-media-gateway:
    build: .
    container_name: ontrack-media-gateway
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5060:5060/udp"
      - "10000-20000:10000-20000/udp"
    volumes:
      - recordings:/var/spool/asterisk/monitor
    healthcheck:
      test: ["CMD-SHELL", "asterisk -rx 'core show uptime seconds' >/dev/null 2>&1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  recordings:

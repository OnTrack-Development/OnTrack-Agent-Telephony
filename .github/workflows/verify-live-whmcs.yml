name: Verify Live WHMCS Site
on:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-live-whmcs.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check-live:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify live WHMCS v0.2.7 and update channel
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://agent.ontrackegy.com"
          curl -fsSL --retry 2 --connect-timeout 8 --max-time 22 -H 'Cache-Control: no-cache' "$BASE/" -o /tmp/home
          grep -qi 'WHMCS' /tmp/home
          echo 'PASS: live WHMCS homepage'
          curl -fsSL --retry 2 --connect-timeout 8 --max-time 22 -H 'Cache-Control: no-cache' "$BASE/api/app/latest.php" -o /tmp/api
          curl -fsSL --retry 2 --connect-timeout 8 --max-time 22 -H 'Cache-Control: no-cache' "$BASE/downloads/latest.json" -o /tmp/meta
          python3 - <<'PY'
          import json
          a=json.load(open('/tmp/api'))
          m=json.load(open('/tmp/meta'))
          for label,obj in [('API',a),('manifest',m)]:
              print(label, 'version:',obj.get('version_name'),'build:',obj.get('version_code'))
              assert obj.get('version_name')=='0.2.7' and obj.get('version_code')==8, f'ERROR: {label} still runs old version'
              assert obj.get('sha256')==m.get('sha256') and obj.get('size_bytes')==m.get('size_bytes')
          assert a.get('ok') is True
          assert a.get('app_id')=='com.ontrackdevelopment.command'
          assert a.get('download_url')=='https://agent.ontrackegy.com/downloads/WHMCS-v0.2.7-ARM64-release-signed.apk'
          open('/tmp/expected_size','w').write(str(m['size_bytes']))
          print('PASS: live version, manifest and API agree')
          PY
          curl -fsSI --retry 2 --connect-timeout 8 --max-time 22 "$BASE/downloads/WHMCS-v0.2.7-ARM64-release-signed.apk" > /tmp/apkheaders
          python3 - <<'PY'
          from email.parser import Parser
          text=open('/tmp/apkheaders').read().replace('\r\n','\n')
          chunks=[p for p in text.split('\n\n') if p.strip()]
          headers=Parser().parsestr(chunks[-1])
          actual=int(headers.get('Content-Length') or -1)
          expected=int(open('/tmp/expected_size').read())
          print('APK expected bytes:',expected,'actual:',actual)
          assert actual==expected, 'APK served with wrong size'
          print('PASS: live WHMCS v0.2.7 APK is served at correct size')
          PY
          old="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 12 "$BASE/login.php")"
          echo "Old login.php HTTP: $old"
          test "$old" = 404
          echo 'PASS: old login.php not served'

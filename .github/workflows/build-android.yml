name: Build Android Bridge APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ontrack-android-release-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_SIGNING_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: android
        run: gradle :app:assembleDebug --stacktrace

      - name: Restore persistent release signing key
        if: env.ANDROID_SIGNING_PASSWORD != ''
        working-directory: android
        shell: bash
        run: |
          openssl enc -d -aes-256-cbc -pbkdf2 -a -A \
            -in signing/ontrack-release.jks.enc.b64 \
            -out signing/ontrack-release.jks \
            -pass env:ANDROID_SIGNING_PASSWORD
          chmod 600 signing/ontrack-release.jks

      - name: Verify signing key
        if: env.ANDROID_SIGNING_PASSWORD != ''
        working-directory: android
        shell: bash
        run: |
          keytool -list -v \
            -keystore signing/ontrack-release.jks \
            -storepass "$ANDROID_SIGNING_PASSWORD" \
            -alias ontrack-telephony | grep -E 'Owner:|Valid from:|SHA256:'

      - name: Build persistently signed release APK
        if: env.ANDROID_SIGNING_PASSWORD != ''
        working-directory: android
        run: gradle :app:assembleRelease --stacktrace

      - name: Signing status
        shell: bash
        run: |
          if [ -n "$ANDROID_SIGNING_PASSWORD" ]; then
            echo "Persistent release signing: ENABLED"
          else
            echo "Persistent release signing: WAITING FOR ANDROID_SIGNING_PASSWORD SECRET"
            echo "Debug APK was still built for development testing."
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: OnTrack-AI-Phone-Bridge-v0.5.3
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: warn

      - name: Publish signed release to website update channel
        if: env.ANDROID_SIGNING_PASSWORD != ''
        shell: bash
        run: |
          set -euo pipefail

          APK="android/app/build/outputs/apk/release/app-release.apk"
          VERSION_CODE="$(grep -E '^[[:space:]]*versionCode ' android/app/build.gradle | awk '{print $2}' | head -1)"
          VERSION_NAME="$(grep -E "^[[:space:]]*versionName '" android/app/build.gradle | sed -E "s/.*versionName '([^']+)'.*/\1/" | sed 's/-poc$//')"
          SHA256="$(sha256sum "$APK" | awk '{print $1}')"
          SIZE_BYTES="$(stat -c%s "$APK")"
          CERT_SHA256="$(keytool -list -v             -keystore android/signing/ontrack-release.jks             -storepass "$ANDROID_SIGNING_PASSWORD"             -alias ontrack-telephony | awk '/SHA256:/{print $2; exit}')"

          git fetch origin main
          git reset --hard origin/main

          mkdir -p web/downloads
          TARGET="web/downloads/OnTrack-AI-Phone-v${VERSION_NAME}.apk"
          cp "$APK" "$TARGET"

          cat > web/downloads/latest.json <<EOF
          {
            "version_code": ${VERSION_CODE},
            "version_name": "${VERSION_NAME}",
            "filename": "OnTrack-AI-Phone-v${VERSION_NAME}.apk",
            "sha256": "${SHA256}",
            "size_bytes": ${SIZE_BYTES},
            "published_at": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')",
            "release_notes": "OnTrack AI Phone v0.5.3: queries TELEPHONY_TX capabilities on-device and injects only using sample rates, channel counts and PCM encoding actually advertised by that phone.",
            "signing_certificate_sha256": "${CERT_SHA256}"
          }
          EOF

          cat > web/downloads/.htaccess <<'EOF'
          Options -Indexes
          AddType application/vnd.android.package-archive .apk
          EOF

          git config user.name "OnTrack Release Bot"
          git config user.email "release-bot@ontrackegy.com"
          git add web/downloads

          if git diff --cached --quiet; then
            echo "No release-channel changes to publish."
            exit 0
          fi

          git commit -m "Publish Android v${VERSION_NAME} signed release [skip ci]"
          git push origin HEAD:main

name: Build Android Bridge APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_SIGNING_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: android
        run: gradle :app:assembleDebug --stacktrace

      - name: Restore persistent release signing key
        if: env.ANDROID_SIGNING_PASSWORD != ''
        working-directory: android
        shell: bash
        run: |
          openssl enc -d -aes-256-cbc -pbkdf2 -a -A             -in signing/ontrack-release.jks.enc.b64             -out signing/ontrack-release.jks             -pass env:ANDROID_SIGNING_PASSWORD
          chmod 600 signing/ontrack-release.jks

      - name: Verify signing key
        if: env.ANDROID_SIGNING_PASSWORD != ''
        working-directory: android
        shell: bash
        run: |
          keytool -list             -keystore signing/ontrack-release.jks             -storepass "$ANDROID_SIGNING_PASSWORD"             -alias ontrack-telephony

      - name: Build persistently signed release APK
        if: env.ANDROID_SIGNING_PASSWORD != ''
        working-directory: android
        run: gradle :app:assembleRelease --stacktrace

      - name: Signing status
        shell: bash
        run: |
          if [ -n "$ANDROID_SIGNING_PASSWORD" ]; then
            echo "Persistent release signing: ENABLED"
          else
            echo "Persistent release signing: WAITING FOR ANDROID_SIGNING_PASSWORD SECRET"
            echo "Debug APK was still built for development testing."
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: OnTrack-AI-Phone-Bridge-v0.3.3
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: warn

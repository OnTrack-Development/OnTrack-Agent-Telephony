name: Build WHMCS Compact ARM64 APK
on:
  push:
    branches: [ontrack-command-native]
    paths:
      - 'mobile/**'
      - 'tests/**'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: whmcs-apk-arm64
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ANDROID_SIGNING_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          test -d "${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMANAGER" ]; then
            "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
          fi
      - name: Install JavaScript dependencies
        working-directory: mobile
        run: npm install --no-audit --no-fund
      - name: Unit tests and typecheck
        working-directory: mobile
        run: npm run typecheck && npm run test:source && node ../tests/ticket_workflow_test.cjs && node ../tests/api_mock_test.cjs && node ../tests/client_profile_test.cjs && node ../tests/directory_ui_test.cjs && node ../tests/module_integration_test.cjs && python3 ../tests/build_workflow_test.py && python3 ../tests/native_admin_routes_test.py
      - name: Generate native Android project
        working-directory: mobile
        run: CI=1 npx expo prebuild --platform android --no-install
      - name: Install native OnTrack update manager after Expo prebuild
        run: python3 mobile/scripts/prepare_native_update.py
      - name: Select installed Android NDK
        shell: bash
        run: |
          set -euo pipefail
          test -f "$ANDROID_HOME/ndk/27.3.13750724/source.properties"
          python3 mobile/scripts/select_android_ndk.py mobile/android/build.gradle 27.3.13750724
      - name: Build debug to initialize React Native and Gradle codegen
        working-directory: mobile/android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Restore existing encrypted release key
        if: env.ANDROID_SIGNING_PASSWORD != ''
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p mobile/android/signing
          git show origin/backup/telephony-server-before-command-2026-10-09:android/signing/ontrack-release.jks.enc.b64 > mobile/android/signing/release.enc.b64
          openssl enc -d -aes-256-cbc -pbkdf2 -a -A \
            -in mobile/android/signing/release.enc.b64 -out mobile/android/signing/release.jks \
            -pass env:ANDROID_SIGNING_PASSWORD
          chmod 600 mobile/android/signing/release.jks
      - name: Configure persistent release signing
        if: env.ANDROID_SIGNING_PASSWORD != ''
        shell: bash
        run: |
          cat >> mobile/android/app/build.gradle <<'GRADLE'
          android {
              signingConfigs {
                  ontrackCommandRelease {
                      storeFile file("../signing/release.jks")
                      storePassword System.getenv("ANDROID_SIGNING_PASSWORD")
                      keyAlias "ontrack-telephony"
                      keyPassword System.getenv("ANDROID_SIGNING_PASSWORD")
                  }
              }
              buildTypes {
                  release { signingConfig signingConfigs.ontrackCommandRelease }
              }
          }
          GRADLE
      - name: Build production-signed APK
        if: env.ANDROID_SIGNING_PASSWORD != ''
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon --stacktrace --info
      - name: Strip other CPU ABIs and re-sign with existing release key
        shell: bash
        run: |
          set -euo pipefail
          APK="mobile/android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          UNIV_SIZE="$(stat -c%s "$APK")"
          cp "$APK" "${APK%.apk}-universal-backup.apk"
          zip -qd "$APK" 'lib/armeabi-v7a/*' 'lib/x86/*' 'lib/x86_64/*' || true
          if unzip -Z1 "$APK" | grep -qE '^lib/(armeabi-v7a|x86|x86_64)/'; then
            echo "Failed to strip non-ARM64 libraries"; exit 1
          fi
          if ! unzip -Z1 "$APK" | grep -q '^lib/arm64-v8a/'; then
            echo "ARM64 native libraries missing"; exit 1
          fi
          BUILD_TOOLS="$(dirname "$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)")"
          "$BUILD_TOOLS/zipalign" -f -p 4 "$APK" "${APK%.apk}-aligned.apk"
          "$BUILD_TOOLS/apksigner" sign \
            --ks mobile/android/signing/release.jks \
            --ks-key-alias ontrack-telephony \
            --ks-pass env:ANDROID_SIGNING_PASSWORD \
            --key-pass env:ANDROID_SIGNING_PASSWORD \
            --out "${APK%.apk}-arm64-signed.apk" "${APK%.apk}-aligned.apk"
          mv "${APK%.apk}-arm64-signed.apk" "$APK"
          echo "Universal APK bytes: $UNIV_SIZE"
          echo "ARM64 APK bytes: $(stat -c%s "$APK")"
      - name: Verify APK signatures
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)"
          APK="mobile/android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          sha256sum "$APK"
          BYTES="$(stat -c%s "$APK")"
          test "$BYTES" -lt 73304381
      - uses: actions/upload-artifact@v4
        with:
          name: WHMCS-v0.3.14-ARM64-signed
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - name: Publish GitHub Release with APK and ZIP
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p out
          APK="mobile/android/app/build/outputs/apk/release/app-release.apk"
          cp "$APK" out/WHMCS-v0.3.14-ARM64-release-signed.apk
          (cd out && zip -9 WHMCS-v0.3.14-ARM64-release-signed.zip WHMCS-v0.3.14-ARM64-release-signed.apk)
          BYTES="$(stat -c%s "$APK")"
          NOTES="WHMCS v0.3.14: keep reply field visible above Android keyboard; retain WHMCS admin signature formatting; show closed tickets only in Closed filter. Existing WhatsApp addon and webhook remain unchanged. Signed ARM64 APK bytes: ${BYTES}."
          gh release create "whmcs-v0.3.14-${GITHUB_RUN_NUMBER}" out/*.apk out/*.zip \
            --target "$GITHUB_SHA" \
            --title "WHMCS v0.3.14 (Android build 25)" \
            --notes "$NOTES"
          echo "Signed APK published; APK release published after successful workflow completion."
      # GitHub-hosted release publishing uses GITHUB_TOKEN; trigger the downstream
      # staging workflow explicitly rather than relying solely on workflow_run.
      - name: Dispatch signed APK to live download website
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run stage-whmcs-release.yml --ref main -R OnTrack-Development/OnTrack-Agent-Telephony
          echo "Requested downstream staging; its own job verifies the live APK and manifest."


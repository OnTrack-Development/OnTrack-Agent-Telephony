name: Build OnTrack Command Compact ARM64 APK
on:
  push:
    branches: [ontrack-command-native]
    paths:
      - 'mobile/**'
      - 'tests/**'
      - '.github/workflows/debug-apk.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: command-apk-arm64-v021
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ANDROID_SIGNING_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          test -d "${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMANAGER" ]; then
            "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
          fi
      - name: Install JavaScript dependencies
        working-directory: mobile
        run: npm install --no-audit --no-fund
      - name: Unit tests and typecheck
        working-directory: mobile
        run: npm run typecheck && npm run test:source
      - name: Generate native Android project
        working-directory: mobile
        run: npx expo prebuild --platform android --no-install --non-interactive
      - name: Build debug to initialize React Native and Gradle codegen
        working-directory: mobile/android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Optimize Release for ARM64
        shell: bash
        run: |
          set -euo pipefail
          # Keep the same Android package / signing cert. Package one target ABI only.
          cat >> mobile/android/gradle.properties <<'PROPS'
          reactNativeArchitectures=arm64-v8a
          android.enableProguardInReleaseBuilds=true
          android.enableShrinkResourcesInReleaseBuilds=true
          PROPS
          # The generated Gradle project is rebuilt each CI run; no source-module changes.
          chmod +x mobile/android/gradlew
      - name: Restore existing encrypted release key
        if: env.ANDROID_SIGNING_PASSWORD != ''
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p mobile/android/signing
          git show origin/backup/telephony-server-before-command-2026-10-09:android/signing/ontrack-release.jks.enc.b64 > mobile/android/signing/release.enc.b64
          openssl enc -d -aes-256-cbc -pbkdf2 -a -A \
            -in mobile/android/signing/release.enc.b64 -out mobile/android/signing/release.jks \
            -pass env:ANDROID_SIGNING_PASSWORD
          chmod 600 mobile/android/signing/release.jks
      - name: Configure persistent release signing
        if: env.ANDROID_SIGNING_PASSWORD != ''
        shell: bash
        run: |
          cat >> mobile/android/app/build.gradle <<'GRADLE'
          android {
              defaultConfig {
                  ndk { abiFilters 'arm64-v8a' }
              }
              signingConfigs {
                  ontrackCommandRelease {
                      storeFile file("../signing/release.jks")
                      storePassword System.getenv("ANDROID_SIGNING_PASSWORD")
                      keyAlias "ontrack-telephony"
                      keyPassword System.getenv("ANDROID_SIGNING_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.ontrackCommandRelease
                      minifyEnabled true
                      shrinkResources true
                  }
              }
          }
          GRADLE
      - name: Build production-signed APK
        if: env.ANDROID_SIGNING_PASSWORD != ''
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon --stacktrace --info
      - name: Verify APK signatures
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)"
          APK="mobile/android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          echo "APK bytes: $(stat -c%s "$APK")"
          sha256sum "$APK"
          # Enforce a real size improvement versus v0.2.0 (73,304,381 bytes).
          BYTES="$(stat -c%s "$APK")"
          test "$BYTES" -lt 73304381
      - uses: actions/upload-artifact@v4
        with:
          name: OnTrack-Command-v0.2.2-ARM64-signed
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p out
          APK="mobile/android/app/build/outputs/apk/release/app-release.apk"
          cp "$APK" out/OnTrack-Command-v0.2.2-ARM64-release-signed.apk
          BYTES="$(stat -c%s "$APK")"
          SAVED="$((73304381-BYTES))"
          NOTES="Signed ARM64-only Android release, R8 minified and resources shrunk. APK bytes: ${BYTES}; saving: ${SAVED} bytes versus the 73,304,381-byte v0.2.0 release. Uses the same signing keystore/package ID for in-place upgrades; requires an ARM64 Android phone."
          gh release create "command-v0.2.2-${GITHUB_RUN_NUMBER}" out/*.apk \
            --title "OnTrack Command v0.2.2 ARM64 Compact (build ${GITHUB_RUN_NUMBER})" \
            --notes "$NOTES"

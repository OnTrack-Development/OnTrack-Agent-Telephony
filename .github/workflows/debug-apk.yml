name: Build OnTrack Command APK
on:
  push:
    branches: [ontrack-command-native]
    paths:
      - 'mobile/**'
      - 'tests/**'
      - '.github/workflows/debug-apk.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: command-apk-main
  cancel-in-progress: false
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ANDROID_SIGNING_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install JavaScript dependencies
        working-directory: mobile
        run: npm install --no-audit --no-fund
      - name: Unit tests and typecheck
        working-directory: mobile
        run: npm run typecheck && npm run test:source
      - name: Generate native Android project
        working-directory: mobile
        run: npx expo prebuild --platform android --no-install --non-interactive
      - name: Build signed debug APK
        working-directory: mobile/android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Restore existing encrypted release key
        if: env.ANDROID_SIGNING_PASSWORD != ''
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p mobile/android/signing
          git show origin/backup/telephony-server-before-command-2026-10-09:android/signing/ontrack-release.jks.enc.b64 > mobile/android/signing/release.enc.b64
          openssl enc -d -aes-256-cbc -pbkdf2 -a -A \
            -in mobile/android/signing/release.enc.b64 -out mobile/android/signing/release.jks \
            -pass env:ANDROID_SIGNING_PASSWORD
          chmod 600 mobile/android/signing/release.jks
      - name: Configure persistent release signing
        if: env.ANDROID_SIGNING_PASSWORD != ''
        shell: bash
        run: |
          cat >> mobile/android/app/build.gradle <<'GRADLE'
          android {
              signingConfigs {
                  ontrackCommandRelease {
                      storeFile file("../signing/release.jks")
                      storePassword System.getenv("ANDROID_SIGNING_PASSWORD")
                      keyAlias "ontrack-telephony"
                      keyPassword System.getenv("ANDROID_SIGNING_PASSWORD")
                  }
              }
              buildTypes {
                  release { signingConfig signingConfigs.ontrackCommandRelease }
              }
          }
          GRADLE
      - name: Build production-signed APK
        if: env.ANDROID_SIGNING_PASSWORD != ''
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon --stacktrace
      - name: Verify APK signatures
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if test -f mobile/android/app/build/outputs/apk/release/app-release.apk; then
            "$APKSIGNER" verify --verbose mobile/android/app/build/outputs/apk/release/app-release.apk
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: OnTrack-Command-Android-APKs
          path: |
            mobile/android/app/build/outputs/apk/debug/app-debug.apk
            mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p out
          if test -f mobile/android/app/build/outputs/apk/release/app-release.apk; then
            cp mobile/android/app/build/outputs/apk/release/app-release.apk out/OnTrack-Command-v0.2.0-release-signed.apk
            NOTES='Signed production Android release; protected by preconfigured repository keystore secret.'
          else
            cp mobile/android/app/build/outputs/apk/debug/app-debug.apk out/OnTrack-Command-v0.2.0-debug-signed.apk
            NOTES='Development build signed with the Android debug key. NOT a production signing key.'
          fi
          gh release create "command-v0.2.0-${GITHUB_RUN_NUMBER}" out/*.apk \
            --title "OnTrack Command v0.2.0 (build ${GITHUB_RUN_NUMBER})" \
            --notes "$NOTES"

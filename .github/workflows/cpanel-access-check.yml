name: Check cPanel WHMCS Deployment Access
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cpanel-access-check.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      CPANEL_USER: agentontrackegy
      CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
    steps:
      - name: Check stored deployment credential and cPanel account
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CPANEL_API_TOKEN}" ]; then
            echo 'CPANEL_API_TOKEN is not configured as a repository Actions secret.'
            exit 2
          fi
          python3 - <<'PY'
          import json,os,urllib.request
          token=os.environ['CPANEL_API_TOKEN']
          req=urllib.request.Request(
            'https://ontrackegy.com:2083/execute/DomainInfo/list_domains',
            headers={'Authorization':'cpanel agentontrackegy:'+token,'Accept':'application/json'}
          )
          with urllib.request.urlopen(req,timeout=25) as response:
            data=json.load(response)
          if data.get('status')!=1:
            raise SystemExit('cPanel authentication or permissions rejected')
          found=data.get('data') or {}
          main=found.get('main_domain') if isinstance(found,dict) else ''
          if main!='agent.ontrackegy.com':
            raise SystemExit('STOP: cPanel domain does not match the intended WHMCS site')
          print('PASS: authenticated as the correct cPanel account and domain')
          PY

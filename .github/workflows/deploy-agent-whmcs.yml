name: Deploy WHMCS Mobile to agent.ontrackegy.com
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-agent-whmcs.yml'
      - 'web/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-agent-whmcs
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
      CPANEL_USER: agentontrackegy
      DEPLOY_DOMAIN: agent.ontrackegy.com
    steps:
      - uses: actions/checkout@v4
      - name: Check signed release artifacts and deploy with cPanel UAPI
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CPANEL_API_TOKEN:-}" || { echo 'FAIL: GitHub Actions CPANEL_API_TOKEN is unavailable'; exit 2; }
          python3 - <<'PY'
          import json, hashlib, pathlib, os, urllib.request, urllib.parse, urllib.error, subprocess, re, sys, time
          site=pathlib.Path('web')
          manifest=json.loads((site/'downloads/latest.json').read_text())
          apk=site/'downloads'/manifest['filename']
          assert manifest['version_name']=='0.2.6' and manifest['version_code']==7, 'unexpected app version'
          assert apk.is_file() and apk.stat().st_size==manifest['size_bytes'], 'APK missing or wrong size'
          assert hashlib.sha256(apk.read_bytes()).hexdigest()==manifest['sha256'], 'APK checksum mismatch'
          print('Verified signed APK manifest and SHA256')
          token=os.environ['CPANEL_API_TOKEN']
          user=os.environ['CPANEL_USER']
          hostname=os.environ['DEPLOY_DOMAIN']
          hosts=['agent.ontrackegy.com','ontrackegy.com']
          headers={'Authorization': f'cpanel {user}:{token}', 'Accept':'application/json'}
          def uapi(host,endpoint,params=None):
              suffix=('?'+urllib.parse.urlencode(params)) if params else ''
              url=f'https://{host}:2083/execute/{endpoint}'+suffix
              req=urllib.request.Request(url,headers=headers)
              try:
                  with urllib.request.urlopen(req,timeout=22) as r:
                      return json.load(r), None
              except urllib.error.HTTPError as e:
                  return None, f'HTTP {e.code}'
              except Exception as e:
                  return None, e.__class__.__name__
          selected=None
          root=None
          for host in hosts:
              j,err=uapi(host,'DomainInfo/single_domain_data',{'domain':hostname})
              if err:
                  print(f'cPanel {host}: {err}')
                  continue
              r=j.get('result') or {}
              d=r.get('data') or {}
              if r.get('status')!=1 or not isinstance(d,dict):
                  print(f'cPanel {host}: domain query rejected')
                  continue
              path=d.get('documentroot') or d.get('docroot') or ''
              name=d.get('domain') or d.get('servername') or hostname
              if name!=hostname:
                  raise SystemExit(f'STOP: unexpected cPanel domain {name}')
              if not re.fullmatch(r'/home/agentontrackegy/[a-zA-Z0-9_.-/]+',path) or '..' in path.split('/'):
                  raise SystemExit('STOP: document root does not belong to agentontrackegy')
              selected=host
              root=path
              break
          if not selected:
              raise SystemExit('BLOCKED: cPanel API token/endpoint rejected. Nothing deployed.')
          print(f'Verified target: {hostname}, docroot {root}, cPanel endpoint {selected}')
          # Only update WHMCS mobile site files; never delete unknown files or databases.
          def api2_mkdir(parent,name):
              params={'cpanel_jsonapi_user':user,'cpanel_jsonapi_apiversion':'2',
                      'cpanel_jsonapi_module':'Fileman','cpanel_jsonapi_func':'mkdir',
                      'path':parent,'name':name,'permissions':'0755'}
              url=f'https://{selected}:2083/json-api/cpanel?'+urllib.parse.urlencode(params)
              req=urllib.request.Request(url,headers=headers)
              try:
                  with urllib.request.urlopen(req,timeout=22) as f:
                      d=json.load(f)
                  data=d.get('cpanelresult',{})
                  if int((data.get('event') or {}).get('result',0))==1:
                      return
                  reason=str((data.get('data') or [{}])[0].get('reason',''))
                  if 'exist' in reason.lower():
                      return
                  raise RuntimeError('Failed to create required directory: '+name)
              except urllib.error.HTTPError as e:
                  raise RuntimeError(f'Directory API returned HTTP {e.code}')
          for parent,name in [(root,'downloads'),(root,'assets'),(root,'api'),(root+'/api','app')]:
              # Directory API 2 is still required by cPanel: no UAPI equivalent exists.
              api2_mkdir(parent,name)
          to_upload=[
              ('index.php',root),
              ('.htaccess',root),
              ('assets/whmcs-icon.png',root+'/assets'),
              ('downloads/.htaccess',root+'/downloads'),
              ('downloads/latest.json',root+'/downloads'),
              ('api/app/latest.php',root+'/api/app'),
              ('downloads/'+manifest['filename'],root+'/downloads'),
          ]
          for relative,dest in to_upload:
              cmd=['curl','--silent','--show-error','--max-time','120',
                   '-H',headers['Authorization'].join([]) if False else 'Authorization: '+headers['Authorization'],
                   '-H','Accept: application/json',
                   '-F','dir='+dest,
                   '-F','file-1=@'+str(site/relative)+';filename='+pathlib.Path(relative).name,
                   f'https://{selected}:2083/execute/Fileman/upload_files']
              run=subprocess.run(cmd,text=True,capture_output=True,timeout=130)
              if run.returncode:
                  raise SystemExit('UPLOAD ERROR: '+relative+' curl code '+str(run.returncode))
              try:
                  data=json.loads(run.stdout)
              except ValueError:
                  raise SystemExit('UPLOAD ERROR: non-JSON response for '+relative)
              result=data.get('result') or data
              if result.get('status')!=1:
                  raise SystemExit('UPLOAD ERROR: cPanel rejected '+relative)
              print('Uploaded '+relative)
          print('UPLOAD_COMPLETE '+hostname)
          for suffix in ['/downloads/latest.json','/']:
              url='https://'+hostname+suffix
              try:
                  with urllib.request.urlopen(url,timeout=20) as response:
                      head=response.read(4096).decode('utf8','replace')
                      if response.status!=200 or (suffix.endswith('.json') and '"version_name"' not in head):
                          raise ValueError('Invalid site response')
                  print('LIVE_VERIFY_PASS '+url)
              except Exception as e:
                  raise SystemExit('LIVE_VERIFY_FAILED '+url+' ('+e.__class__.__name__+')')
          PY

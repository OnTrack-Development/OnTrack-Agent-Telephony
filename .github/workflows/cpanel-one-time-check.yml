name: One-time encrypted cPanel connection
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cpanel-one-time-check.yml
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Prepare one-time RSA public key for secure token handoff
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out /tmp/cpanel-private.pem >/dev/null 2>&1
          openssl rsa -in /tmp/cpanel-private.pem -pubout -out /tmp/cpanel-public.pem >/dev/null 2>&1
          PUB="$(base64 -w0 /tmp/cpanel-public.pem)"
          gh api -X PUT "repos/${GITHUB_REPOSITORY}/contents/.deploy/cpanel-ephemeral-public.pem" -f message="One-time public key for encrypted deploy handoff" -f content="$PUB" -f branch=main --silent
          echo "Ephemeral encryption public key published"
      - name: Wait for one-time ciphertext and validate cPanel account
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Waiting for encrypted token handoff..."
          for i in $(seq 1 100); do
            if gh api -H "Accept: application/vnd.github.raw+json" "repos/${GITHUB_REPOSITORY}/contents/.deploy/cpanel-auth.enc.b64?ref=main" > /tmp/cpanel-encrypted.txt 2>/dev/null; then
              break
            fi
            sleep 5
          done
          test -s /tmp/cpanel-encrypted.txt || { echo "No ciphertext received"; exit 1; }
          base64 -d /tmp/cpanel-encrypted.txt >/tmp/cpanel-cipher.bin
          openssl pkeyutl -decrypt -inkey /tmp/cpanel-private.pem -in /tmp/cpanel-cipher.bin -out /tmp/cpanel-token.txt -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -pkeyopt rsa_mgf1_md:sha256
          CPANEL_TOKEN="$(cat /tmp/cpanel-token.txt)"
          echo "::add-mask::$CPANEL_TOKEN"
          rm -f /tmp/cpanel-token.txt /tmp/cpanel-cipher.bin /tmp/cpanel-private.pem
          RESPONSE="$(curl --silent --show-error --max-time 20 --fail-with-body \
            -H "Authorization: cpanel agentontrackegy:$CPANEL_TOKEN" \
            -H "Accept: application/json" \
            "https://agent.ontrackegy.com:2083/execute/DomainInfo/domains_data?format=hash")"
          unset CPANEL_TOKEN
          RESP="$RESPONSE" python3 - <<'PY'
          import json,os
          d=json.loads(os.environ['RESP'])
          result=d.get('result') or {}
          if result.get('status')!=1:
              print('CPANEL_AUTH_FAILED', result.get('errors'), result.get('messages'))
              raise SystemExit(1)
          data=result.get('data')
          print('CPANEL_AUTH_SUCCEEDED')
          print('DOMAINS_DATA_TYPE',type(data).__name__)
          if isinstance(data,dict):
              for k,v in data.items():
                  if k in ('main_domain','sub_domains','addon_domains','parked_domains','subdomains'):
                      print(k,json.dumps(v,ensure_ascii=False)[:3000])
          elif isinstance(data,list):
              for domain in data:
                  print(json.dumps(domain,ensure_ascii=False)[:2500])
          PY

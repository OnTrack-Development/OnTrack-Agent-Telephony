name: Package WHMCS Website with Server-Side GitHub Pull
on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/export-whmcs-site.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Verify release files and restored GitHub pull updater
        shell: bash
        run: |
          set -euo pipefail
          php -l web/app/site_updater.php
          php -l web/index.php
          php -l web/api/app/latest.php
          php -l web/update.php
          php -r 'require "web/app/site_updater.php"; if (!function_exists("otup_auto_tick") || !function_exists("otup_validate_whmcs_tree")) exit(1); echo "PASS: updater module compiled\n";'
          python3 - <<'PY'
          from pathlib import Path
          import json,hashlib
          root=Path('web')
          m=json.loads((root/'downloads/latest.json').read_text())
          v=m['version_name'];apk=root/'downloads'/m['filename']
          assert isinstance(v,str) and len(v.split('.'))==3 and int(m['version_code'])>=8
          assert m['app_id']=='com.ontrackdevelopment.command'
          assert apk.stat().st_size==m['size_bytes']
          assert hashlib.sha256(apk.read_bytes()).hexdigest()==m['sha256']
          for f in ['index.php','.htaccess','api/app/latest.php','app/site_updater.php','update.php','assets/whmcs-icon.png','downloads/.htaccess']:
           assert (root/f).is_file(),f
          assert 'otup_schedule_auto' in (root/'index.php').read_text()
          assert 'otup_schedule_auto' in (root/'api/app/latest.php').read_text()
          print('PASS: GitHub pull updater, signed APK, release and website integrated:',v)
          Path('/tmp/whmcs-export-version').write_text(v)
          PY
          version="$(cat /tmp/whmcs-export-version)"
          (cd web && zip -qr "../WHMCS-Server-v${version}-GitHub-AutoSync.zip" .)
          unzip -t "WHMCS-Server-v${version}-GitHub-AutoSync.zip" | tail -2
      - uses: actions/upload-artifact@v4
        with:
          name: WHMCS-Server-GitHub-AutoSync
          path: WHMCS-Server-v*-GitHub-AutoSync.zip
          retention-days: 30
      - name: Publish verified installer to signed release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(cat /tmp/whmcs-export-version)"
          tag="$(gh release list --limit 60 --json tagName --jq '.[] | .tagName' | grep -E "^whmcs-v${version}-[0-9]+$" | head -n1)"
          test -n "$tag"
          gh release upload "$tag" "WHMCS-Server-v${version}-GitHub-AutoSync.zip" --clobber

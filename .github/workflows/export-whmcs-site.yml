name: Export WHMCS Website Source
# Export the exact APK+manifest pair after the 0.2.7 signed release is staged.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/export-whmcs-site.yml
      - web/downloads/latest.json
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Verify site and package its exact signed APK
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,hashlib
          root=Path('web')
          m=json.loads((root/'downloads/latest.json').read_text())
          v=m['version_name'];apk=root/'downloads'/m['filename']
          assert v in ('0.2.6','0.2.7') and m['version_code']==(7 if v=='0.2.6' else 8)
          assert apk.stat().st_size==m['size_bytes']
          assert hashlib.sha256(apk.read_bytes()).hexdigest()==m['sha256']
          for f in ['index.php','.htaccess','api/app/latest.php','assets/whmcs-icon.png','downloads/.htaccess']:
           assert (root/f).is_file(),f
          print('PASS: archive checksums and required files; version:',v)
          Path('/tmp/whmcs_version').write_text(v)
          PY
          version="$(cat /tmp/whmcs_version)"
          (cd web && zip -qr "../WHMCS-Server-v${version}-Ready-To-Upload.zip" .)
          unzip -t "WHMCS-Server-v${version}-Ready-To-Upload.zip" | tail -2
          cp "WHMCS-Server-v${version}-Ready-To-Upload.zip" WHMCS-Server-Ready-To-Upload.zip
      - uses: actions/upload-artifact@v4
        with:
          name: WHMCS-Server-Ready-To-Upload
          path: WHMCS-Server-Ready-To-Upload.zip
          retention-days: 30

name: Verify WHMCS cPanel destination
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-whmcs-cpanel.yml'
jobs:
  cpanel:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Confirm API authentication and actual document root
        env:
          CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CPANEL_API_TOKEN:-}" ]]; then
            echo "MISSING CPANEL_API_TOKEN GitHub Actions secret. No cPanel operations performed."
            exit 1
          fi
          curl -fSs --connect-timeout 10 --max-time 25 \
            -H "Authorization: cpanel agentontrackegy:${CPANEL_API_TOKEN}" \
            'https://ontrackegy.com:2083/execute/DomainInfo/single_domain_data?domain=agent.ontrackegy.com' \
            -o /tmp/cpanel_domain.json
          python3 - <<'PY'
          import json
          j=json.load(open('/tmp/cpanel_domain.json'))
          r=j.get('result') or {}
          if r.get('status') != 1:
              raise SystemExit('cPanel API authentication or domain lookup failed; no file changes')
          d=r.get('data') or {}
          name=d.get('domain') or d.get('servername') or ''
          root=d.get('documentroot') or d.get('docroot') or ''
          if name not in ('','agent.ontrackegy.com'):
              raise SystemExit('Wrong domain. Refusing deployment')
          if not root.startswith('/home/agentontrackegy/') or root.rstrip('/') == '/home/agentontrackegy':
              raise SystemExit('Document root outside the confirmed hosting account. Refusing deployment.')
          print('Verified cPanel account: agentontrackegy')
          print('Verified requested domain: agent.ontrackegy.com')
          print('Document root: '+root)
          print('No files modified.')
          PY

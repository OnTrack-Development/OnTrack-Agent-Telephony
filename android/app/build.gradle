plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ontrack.agentphone'
    compileSdk 35

    defaultConfig {
        applicationId 'com.ontrack.agentphone'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '0.3.1-poc'
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

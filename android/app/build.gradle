plugins {
    id 'com.android.application'
}

def releasePassword = System.getenv('ANDROID_SIGNING_PASSWORD') ?: ''

android {
    namespace 'com.ontrack.agentphone'
    compileSdk 35

    defaultConfig {
        applicationId 'com.ontrack.agentphone'
        minSdk 26
        targetSdk 35
        versionCode 24
        versionName '0.7.0'
    }

    signingConfigs {
        release {
            storeFile rootProject.file('signing/ontrack-release.jks')
            storePassword releasePassword
            keyAlias 'ontrack-telephony'
            keyPassword releasePassword
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.15.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.github.MuntashirAkon:libadb-android:3.1.1'
    implementation 'org.bouncycastle:bcprov-jdk15to18:1.81'
    implementation 'org.bouncycastle:bcpkix-jdk15to18:1.81'
    implementation 'org.conscrypt:conscrypt-android:2.5.3'
}

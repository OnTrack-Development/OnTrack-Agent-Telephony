plugins {
    id 'com.android.application'
}

def releasePassword = System.getenv('ANDROID_SIGNING_PASSWORD') ?: ''

android {
    namespace 'com.ontrack.agentphone'
    compileSdk 35

    defaultConfig {
        applicationId 'com.ontrack.agentphone'
        minSdk 26
        targetSdk 35
        versionCode 8
        versionName '0.4.1-poc'
    }

    signingConfigs {
        release {
            storeFile rootProject.file('signing/ontrack-release.jks')
            storePassword releasePassword
            keyAlias 'ontrack-telephony'
            keyPassword releasePassword
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.15.0'
}
